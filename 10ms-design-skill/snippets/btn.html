<!-- 10MS Button Variants — all use pill radius (999px)
     One primary CTA max per view.
     Icon-only square uses r-xl (12px), not pill.
-->

<!-- Primary: bg green-cta, one per view max -->
<button style="background:#37C25C;color:#FFFFFF;border:none;border-radius:999px;padding:16px 28px;font-family:'Anek Bangla',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;">
  Label
</button>

<!-- Primary hover (apply on :hover) -->
<!-- background:#17994B; transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,0.12) -->

<!-- Secondary filled -->
<button style="background:#D0FAD0;color:#086347;border:1.5px solid #1CAB55;border-radius:999px;padding:14px 28px;font-family:'Anek Bangla',sans-serif;font-size:1rem;font-weight:500;cursor:pointer;">
  Label
</button>

<!-- Secondary outlined -->
<button style="background:transparent;color:#149353;border:1.5px solid #149353;border-radius:999px;padding:14px 28px;font-family:'Anek Bangla',sans-serif;font-size:1rem;font-weight:500;cursor:pointer;">
  Label
</button>

<!-- Ghost -->
<button style="background:transparent;color:#374151;border:1.5px solid #E5E7EB;border-radius:999px;padding:14px 28px;font-family:'Anek Bangla',sans-serif;font-size:1rem;font-weight:500;cursor:pointer;">
  Label
</button>

<!-- Text/link -->
<button style="background:transparent;color:#149353;border:none;padding:0;font-family:'Anek Bangla',sans-serif;font-size:1rem;cursor:pointer;">
  Link text →
</button>

<!-- Disabled -->
<button style="background:#E5E7EB;color:#D1D5DB;border:none;border-radius:999px;padding:16px 28px;font-family:'Anek Bangla',sans-serif;font-size:1rem;cursor:not-allowed;" disabled>
  Label
</button>

<!-- Icon-only square (utility, filter) — r-xl not pill -->
<button style="width:44px;height:44px;border-radius:12px;border:1.5px solid #E5E7EB;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#374151;">
  <!-- Phosphor icon 20px -->
</button>
