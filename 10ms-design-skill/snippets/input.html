<!-- 10MS Input States — radius 12px (r-xl), padding 14px 16px -->

<!-- Default -->
<input style="width:100%;background:#FFFFFF;border:1px solid #D1D5DB;border-radius:12px;padding:14px 16px;font-family:'Anek Bangla',sans-serif;font-size:1rem;color:#111827;outline:none;" placeholder="Placeholder text (#6B7280)">

<!-- Focus: 2px primary border + green glow -->
<input style="width:100%;background:#FFFFFF;border:2px solid #1CAB55;border-radius:12px;padding:14px 16px;font-family:'Anek Bangla',sans-serif;font-size:1rem;color:#111827;outline:none;box-shadow:0 0 0 3px rgba(28,171,85,0.10);" value="Focused input">

<!-- Positive / validated -->
<input style="width:100%;background:#FFFFFF;border:2px solid #1CAB55;border-radius:12px;padding:14px 16px;font-family:'Anek Bangla',sans-serif;font-size:1rem;color:#111827;outline:none;" value="Valid value">
<span style="font-size:12px;color:#1CAB55;margin-top:4px;display:block;">Helper text</span>

<!-- Error -->
<input style="width:100%;background:#FFFFFF;border:2px solid #DC2626;border-radius:12px;padding:14px 16px;font-family:'Anek Bangla',sans-serif;font-size:1rem;color:#111827;outline:none;" value="Invalid value">
<span style="font-size:12px;color:#DC2626;margin-top:4px;display:block;">Error message</span>

<!-- Disabled -->
<input style="width:100%;background:#F3F4F6;border:1px solid #E5E7EB;border-radius:12px;padding:14px 16px;font-family:'Anek Bangla',sans-serif;font-size:1rem;color:#D1D5DB;outline:none;cursor:not-allowed;" placeholder="Disabled" disabled>
