<!-- 10MS Chip / Filter Variants — all pill radius (999px) -->

<!-- Selected chip -->
<button style="background:#111827;color:#FFFFFF;border:none;border-radius:999px;padding:8px 16px;font-family:'Anek Bangla',sans-serif;font-size:0.875rem;font-weight:500;cursor:pointer;">
  Selected
</button>

<!-- Unselected chip -->
<button style="background:#FFFFFF;color:#111827;border:1px solid #E5E7EB;border-radius:999px;padding:8px 16px;font-family:'Anek Bangla',sans-serif;font-size:0.875rem;cursor:pointer;">
  Unselected
</button>
<!-- hover: border-color:#149353; color:#149353 -->

<!-- Active-indicator chip (e.g. "Live Now") -->
<button style="background:#EAFEF2;color:#086347;border:none;border-radius:999px;padding:8px 16px;font-family:'Anek Bangla',sans-serif;font-size:0.875rem;font-weight:500;">
  Live Now
</button>

<!-- Tab chip — active (inside surface-subtle pill container) -->
<button style="background:#FFFFFF;color:#149353;border:none;border-radius:10px;padding:8px 16px;font-family:'Anek Bangla',sans-serif;font-size:0.875rem;font-weight:500;">
  Active Tab
</button>

<!-- Tab chip — inactive -->
<button style="background:transparent;color:#6B7280;border:none;border-radius:10px;padding:8px 16px;font-family:'Anek Bangla',sans-serif;font-size:0.875rem;">
  Inactive Tab
</button>
